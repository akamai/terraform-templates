name: Release Automation

on:
  push:
    branches:
      - integration
      # - main
      # - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install -g conventional-changelog-cli
          npm install -g semver

      - name: Get current version
        id: current_version
        run: |
          if [ -f VERSION ]; then
            echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
          else
            echo "version=1.2.0" >> $GITHUB_OUTPUT
          fi

      - name: Determine version bump
        id: version_bump
        run: |
          CURRENT_VERSION="${{ steps.current_version.outputs.version }}"
          
          # Get commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s")
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"%s")
          fi
          
          # Determine version bump based on conventional commits
          if echo "$COMMITS" | grep -qiE "^(feat|feature)(\(.*\))?!:|^BREAKING CHANGE:"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qiE "^(feat|feature)(\(.*\))?:"; then
            BUMP="minor"
          elif echo "$COMMITS" | grep -qiE "^(fix|bugfix)(\(.*\))?:"; then
            BUMP="patch"
          else
            BUMP="patch"
          fi
          
          # Calculate new version
          NEW_VERSION=$(npx semver -i $BUMP $CURRENT_VERSION)
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP" >> $GITHUB_OUTPUT

      - name: Update VERSION file
        run: |
          echo "${{ steps.version_bump.outputs.new_version }}" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate terraform-docs for AAP Configuration
        uses: terraform-docs/gh-actions@v1.2.0
        with:
          working-dir: ./new-aap-configuration
          output-file: README.md
          output-method: inject
          git-push: false

      - name: Generate terraform-docs for AAP/ASM Configuration
        uses: terraform-docs/gh-actions@v1.2.0
        with:
          working-dir: ./new-aapasm-configuration
          output-file: README.md
          output-method: inject
          git-push: false

      - name: Generate terraform-docs for Property
        uses: terraform-docs/gh-actions@v1.2.0
        with:
          working-dir: ./new-property
          output-file: README.md
          output-method: inject
          git-push: false

      - name: Generate Changelog
        id: changelog
        run: |
          # Get the last tag or use beginning of git history
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"* %s (%h)" --no-merges)
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"* %s (%h)" --no-merges)
          fi
          
          # Create new changelog entry
          NEW_VERSION="${{ steps.version_bump.outputs.new_version }}"
          DATE=$(date +"%b %d, %Y")
          
          # Categorize commits
          FEATURES=$(echo "$COMMITS" | grep -iE "^\* (feat|feature)(\(.*\))?:" || true)
          FIXES=$(echo "$COMMITS" | grep -iE "^\* (fix|bugfix)(\(.*\))?:" || true)
          BREAKING=$(echo "$COMMITS" | grep -iE "BREAKING CHANGE" || true)
          
          # Build changelog content
          CHANGELOG_CONTENT="## ${NEW_VERSION} (${DATE})"$'\n\n'
          
          if [ ! -z "$BREAKING" ]; then
            CHANGELOG_CONTENT+="#### BREAKING CHANGES:"$'\n\n'
            CHANGELOG_CONTENT+="${BREAKING}"$'\n\n'
          fi
          
          if [ ! -z "$FEATURES" ]; then
            CHANGELOG_CONTENT+="#### FEATURES/ENHANCEMENTS:"$'\n\n'
            CHANGELOG_CONTENT+="* General"$'\n'
            CHANGELOG_CONTENT+="${FEATURES}"$'\n\n'
          fi
          
          if [ ! -z "$FIXES" ]; then
            CHANGELOG_CONTENT+="#### BUG FIXES:"$'\n\n'
            CHANGELOG_CONTENT+="* General"$'\n'
            CHANGELOG_CONTENT+="${FIXES}"$'\n\n'
          fi
          
          # Prepend to existing CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            TEMP_FILE=$(mktemp)
            echo "# RELEASE NOTES" > $TEMP_FILE
            echo "" >> $TEMP_FILE
            echo "$CHANGELOG_CONTENT" >> $TEMP_FILE
            tail -n +3 CHANGELOG.md >> $TEMP_FILE
            mv $TEMP_FILE CHANGELOG.md
          else
            echo "# RELEASE NOTES" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "$CHANGELOG_CONTENT" >> CHANGELOG.md
          fi
          
          # Save changelog for release notes
          echo "$CHANGELOG_CONTENT" > /tmp/release_notes.md

      - name: Commit version, changelog, and documentation
        run: |
          git add VERSION CHANGELOG.md new-aap-configuration/README.md new-aapasm-configuration/README.md new-property/README.md
          git commit -m "chore: release version ${{ steps.version_bump.outputs.new_version }} [skip ci]" || echo "No changes to commit"
          git push

      - name: Create Git Tag
        run: |
          git tag -a "v${{ steps.version_bump.outputs.new_version }}" -m "Release v${{ steps.version_bump.outputs.new_version }}"
          git push origin "v${{ steps.version_bump.outputs.new_version }}"

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version_bump.outputs.new_version }}
          release_name: Release v${{ steps.version_bump.outputs.new_version }}
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: false
