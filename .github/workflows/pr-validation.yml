name: Integration PR Validation

on:
  pull_request:
    branches:
      - integration
    paths:
      - '**.tf'
      - '**.tfvars'
      - '**.ps1'
      - 'tests/**'
      - '.github/workflows/**.yml'

env:
  TF_VERSION: '1.12.1'

jobs:
  terraform-checks:
    name: Terraform PR Checks
    if: github.head_ref != 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: |
          echo "Checking Terraform formatting..."
          terraform fmt -check -recursive
        continue-on-error: false

      - name: Terraform Validate - AAP Configuration
        working-directory: ./new-aap-configuration
        run: |
          terraform init -backend=false
          terraform validate

      - name: Terraform Validate - AAP/ASM Configuration
        working-directory: ./new-aapasm-configuration
        run: |
          terraform init -backend=false
          terraform validate

      - name: Terraform Validate - BMP - New Transactional Endpoint
        working-directory: ./new-bmp-endpoints
        run: |
          terraform init -backend=false
          terraform validate

      - name: Terraform Validate - Datastream
        working-directory: ./new-ds2
        run: |
          terraform init -backend=false
          terraform validate
      
      - name: Terraform Validate - CPS - DV SAN Cert
        working-directory: ./new-dv-san-cert
        run: |
          terraform init -backend=false
          terraform validate

      - name: Terraform Validate - EDNS 
        working-directory: ./new-edns
        run: |
          terraform init -backend=false
          terraform validate

      - name: Terraform Validate - Property
        working-directory: ./new-property
        run: |
          terraform init -backend=false
          terraform validate

      - name: Terraform Validate - CPS - Third Party Cert
        working-directory: ./new-third-party-cert
        run: |
          terraform init -backend=false
          terraform validate

      - name: Terraform Validate - Domain Ownership Management
        working-directory: ./new-dom
        run: |
          terraform init -backend=false
          terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest

      - name: Init TFLint
        run: tflint --init

      - name: Run TFLint - AAP Configuration
        working-directory: ./new-aap-configuration
        run: tflint --recursive

      - name: Run TFLint - AAP/ASM Configuration
        working-directory: ./new-aapasm-configuration
        run: tflint --recursive

      - name: Run TFLint - BMP - New Transactional Endpoint
        working-directory: ./new-bmp-endpoints
        run: tflint --recursive

      - name: Run TFLint - Datastream
        working-directory: ./new-ds2
        run: tflint --recursive

      - name: Run TFLint - CPS - DV SAN Cert
        working-directory: ./new-dv-san-cert
        run: tflint --recursive

      - name: Run TFLint - EDNS 
        working-directory: ./new-edns
        run: tflint --recursive

      - name: Run TFLint - Property
        working-directory: ./new-property
        run: tflint --recursive

      - name: Run TFLint - CPS - Third Party Cert
        working-directory: ./new-third-party-cert
        run: tflint --recursive

      - name: Run TFLint - Domain Ownership Management
        working-directory: ./new-dom
        run: tflint --recursive

      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  powershell-tests:
    name: Deployment Tests
    if: github.head_ref != 'main'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PowerShell
        shell: pwsh
        run: |
          $PSVersionTable

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Run Pester Tests
        shell: pwsh
        run: |
          Import-Module Pester
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'test-results.xml'
          $config.TestResult.OutputFormat = 'NUnitXml'
          Invoke-Pester -Configuration $config

      - name: Upload Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: test-results.xml
          check_name: Deployment Test Results